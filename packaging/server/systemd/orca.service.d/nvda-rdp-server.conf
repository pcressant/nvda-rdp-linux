# Installed by nvda-rdp-server: in a remote session, Orca uses the RDP
# client's braille display and NVDA's speech.
[Unit]
Wants=nvda-rdp-server-session.service nvda-rdp-brlapi.service nvda-rdp-speechd.service
After=nvda-rdp-server-session.service nvda-rdp-brlapi.service nvda-rdp-speechd.service

[Service]
EnvironmentFile=-%t/nvda-rdp-server/orca.env
